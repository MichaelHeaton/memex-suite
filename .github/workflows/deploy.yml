name: Deploy

on:
  push:
    branches: [main]

# Required GitHub Actions configuration (set after platform-bootstrap terraform apply):
#   Secrets → AWS_DEPLOY_ROLE_ARN   : value of platform-bootstrap output service_deploy_role_arns["memex-suite"]
#   Variables → AWS_SAM_BUCKET      : value of platform-bootstrap output service_artifact_buckets["memex-suite"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: pytest services/*/tests/ -v

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # required for OIDC token exchange
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/setup-sam@v2
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: SAM build
        run: sam build --template infrastructure/template.yaml
      - name: SAM deploy
        run: |
          sam deploy \
            --template infrastructure/template.yaml \
            --stack-name memex-prod \
            --s3-bucket ${{ vars.AWS_SAM_BUCKET }} \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM
